name: Feature request
description: Suggest an improvement for Pebble Golf Live
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Pebble Golf Live.

  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Explain the use case or problem this would solve.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Golf Now
        - Tournaments
        - Leaderboard
        - Player details
        - Scorecard
        - History
        - Timeline
        - UI / design
        - Touch / buttons
        - Other

  - type: textarea
    id: extra
    attributes:
      label: Additional details
      description: Mockups, examples, or other notes are welcome.
