name: Bug report
description: Report a problem with Pebble Golf Live
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pebble Golf Live.

  - type: dropdown
    id: watch
    attributes:
      label: Pebble model
      options:
        - Pebble Time 2
        - Pebble Round 2
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: "Example: 0.0.3"
      placeholder: 0.0.3
    validations:
      required: true

  - type: input
    id: tournament
    attributes:
      label: Tournament / event
      description: If relevant, enter the tournament where the issue happened.
      placeholder: The Masters

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Pebble Golf Live
        2. Go to ...
        3. Select ...
        4. See the issue

  - type: textarea
    id: extra
    attributes:
      label: Additional details
      description: Add screenshots, logs, or anything else that may help.
